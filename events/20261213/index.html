  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

  <style>
    :root {
      --tamadev-orange: #e47b47;
      --tamadev-blue: #283f7b;
      --tamadev-sky: #73bfdc;
      --tamadev-bg: #f4fbfa;
      --tamadev-mint: #dff2ef;
      --tamadev-card: #ffffff;
      --tamadev-text: #22313f;
      --tamadev-subtext: #5d6b78;
      --tamadev-border: #d7e7e4;
      --tamadev-shadow: 0 10px 30px rgba(26,49,69,.08);
      --tamadev-radius: 20px;
      --container: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--tamadev-text);
      background:
        radial-gradient(circle at top right, rgba(115,191,220,.18), transparent 28%),
        radial-gradient(circle at top left, rgba(228,123,71,.10), transparent 24%),
        var(--tamadev-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(calc(100% - 32px), var(--container));
      margin: 0 auto;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* Top */
    .topbar {
      padding: 18px 0 0;
      font-size: .95rem;
    }

    .topbar a {
      color: var(--tamadev-subtext);
      text-decoration: none;
    }

    .topbar a:hover {
      text-decoration: underline;
    }

    /* Key visual */
    .conference-visual {
      overflow: hidden;
      margin: 18px 0 24px;
      background: #fff;
      border: 1px solid var(--tamadev-border);
      border-radius: 28px;
      box-shadow: var(--tamadev-shadow);
    }

    .conference-visual img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Event summary */
    .event-summary {
      display: grid;
      grid-template-columns: 1.35fr .95fr;
      gap: 32px;
      align-items: center;
      margin: 0 0 28px;
      padding: 30px 28px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,.94),
        rgba(237,248,247,.94)
      );
      border: 1px solid var(--tamadev-border);
      border-radius: 24px;
      box-shadow: var(--tamadev-shadow);
    }

    .summary-title {
      margin: 0 0 6px;
      padding: 0;
      color: var(--tamadev-blue);
      font-size: clamp(1.8rem,3.2vw,2.6rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -.02em;
    }

    .summary-title::before,
    .summary-title::after {
      content: none !important;
      display: none !important;
    }

    .tech-tama-word {
      white-space: nowrap;
    }

    .tama-accent,
    .tama-initial {
      color: var(--tamadev-orange);
    }

    .tama-initial {
      font-weight: 800;
    }

    .conference-expansion {
      margin: 0 0 18px;
      color: var(--tamadev-subtext);
      font-size: clamp(.92rem,1.8vw,1.08rem);
      font-weight: 600;
      line-height: 1.6;
      letter-spacing: .01em;
    }

    .hero-tagline {
      display: inline-block;
      margin: 0 0 18px;
      padding: 8px 14px;
      background: rgba(115,191,220,.16);
      border-radius: 999px;
      color: var(--tamadev-blue);
      font-size: .95rem;
      font-weight: 700;
    }

    .hero-text {
      margin: 0;
      color: var(--tamadev-subtext);
      font-size: 1rem;
      line-height: 1.9;
    }

    .hero-side {
      padding: 22px 20px;
      background: rgba(255,255,255,.82);
      border: 1px solid var(--tamadev-border);
      border-radius: 20px;
    }

    .hero-side h2 {
      margin: 0 0 16px;
      padding: 0;
      color: var(--tamadev-blue);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .hero-side h2::before,
    .hero-side h2::after,
    .section-header h2::before,
    .section-header h2::after {
      content: none !important;
      display: none !important;
    }

    .info-list {
      display: grid;
      gap: 0;
    }

    .info-item {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 14px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px dashed var(--tamadev-border);
    }

    .info-item:first-child {
      padding-top: 4px;
    }

    .info-item:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .info-label {
      color: var(--tamadev-subtext);
      font-size: .9rem;
      font-weight: 700;
    }

    .info-value {
      color: var(--tamadev-text);
      font-weight: 700;
    }

    .info-note {
      margin-left: 6px;
      color: var(--tamadev-subtext);
      font-size: .82rem;
      font-weight: 400;
    }

    /* Sections */
    .section {
      margin: 28px 0;
      padding: 28px 24px;
      background: var(--tamadev-card);
      border: 1px solid var(--tamadev-border);
      border-radius: var(--tamadev-radius);
      box-shadow: var(--tamadev-shadow);
    }

    .section-header {
      margin-bottom: 18px;
    }

    .section-header h2 {
      margin: 0 0 8px;
      padding: 0;
      color: var(--tamadev-blue);
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .section-header p,
    .section > p {
      margin: 0 0 14px;
      color: var(--tamadev-subtext);
      line-height: 1.9;
    }

    .section > p:last-child {
      margin-bottom: 0;
    }

    #overview {
      padding-top: 28px !important;
    }

    #overview > .section-header {
      position: static !important;
      margin: 0 0 18px !important;
      padding: 0 !important;
      transform: none !important;
    }

    #overview > .section-header h2 {
      position: static !important;
      top: auto !important;
      left: auto !important;
      margin: 0 0 8px !important;
      padding: 0 !important;
      line-height: 1.3 !important;
      transform: none !important;
    }

    #overview > .section-header h2::before,
    #overview > .section-header h2::after {
      content: none !important;
      display: none !important;
    }

    /* Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 18px;
    }

    .card {
      padding: 20px;
      background: #fff;
      border: 1px solid var(--tamadev-border);
      border-radius: 18px;
    }

    .card h3 {
      margin: 0 0 10px;
      color: var(--tamadev-text);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card p {
      margin: 0;
      color: var(--tamadev-subtext);
      line-height: 1.9;
    }

    .proposal-note,
    .schedule-note {
      padding: 18px;
      background: #f9fcfc;
      border: 1px dashed var(--tamadev-border);
      border-radius: 16px;
      color: var(--tamadev-subtext);
      line-height: 1.9;
    }

    .proposal-link {
      display: block;
      color: var(--tamadev-subtext);
      text-decoration: none;
      transition:
        border-color .2s ease,
        background-color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
    }

    .proposal-link strong,
    .proposal-link span {
      display: block;
    }

    .proposal-link strong {
      margin-bottom: 4px;
      color: var(--tamadev-blue);
      font-size: 1.05rem;
    }

    .proposal-link-arrow {
      margin-top: 8px;
      color: var(--tamadev-blue);
      font-weight: 700;
    }

    .proposal-link:hover {
      background: #f2f9f8;
      border-color: var(--tamadev-sky);
      box-shadow: 0 8px 22px rgba(26,49,69,.08);
      transform: translateY(-1px);
    }

    .proposal-link:focus-visible {
      outline: 3px solid rgba(115,191,220,.45);
      outline-offset: 3px;
    }

    .proposal-details {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    .proposal-detail {
      padding: 16px 18px;
      background: #fff;
      border: 1px solid var(--tamadev-border);
      border-radius: 16px;
    }

    .proposal-detail strong {
      color: var(--tamadev-text);
    }

    .proposal-detail p {
      margin: 4px 0 0;
      color: var(--tamadev-subtext);
      line-height: 1.8;
    }

    /* News */
    .news-list {
      display: grid;
      max-height: 216px;
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-gutter: stable;
    }

    .news-item {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 18px;
      align-items: center;
      min-height: 72px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--tamadev-border);
      color: var(--tamadev-text);
      text-decoration: none;
    }

    .news-item:first-child {
      border-top: 1px solid var(--tamadev-border);
    }

    .news-item time {
      color: var(--tamadev-subtext);
      font-size: .9rem;
      font-weight: 600;
    }

    .news-item span {
      font-weight: 600;
    }

    .news-item:hover span {
      color: var(--tamadev-blue);
      text-decoration: underline;
    }

    .news-list::-webkit-scrollbar {
      width: 8px;
    }

    .news-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .news-list::-webkit-scrollbar-thumb {
      background: var(--tamadev-border);
      border-radius: 999px;
    }

    /* Keynote */
    .keynote-profile {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 24px;
      align-items: start;
    }

    .keynote-image {
      display: block;
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
    }

    .keynote-content h3 {
      margin: 0 0 8px;
      color: var(--tamadev-text);
      font-size: 1.5rem;
      font-weight: 700;
    }

    .keynote-content p {
      margin: 0 0 12px;
      color: var(--tamadev-subtext);
      line-height: 1.9;
    }

    .keynote-content p:last-child {
      margin-bottom: 0;
    }

    .keynote-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .keynote-links a {
      color: var(--tamadev-blue);
      font-weight: 700;
    }

    /* Staff */
    .staff-group + .staff-group {
      margin-top: 34px;
    }

    .staff-group-title {
      display: inline-block;
      margin: 0 0 20px;
      padding: 5px 12px;
      background: var(--tamadev-blue);
      border-radius: 999px;
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .staff-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px 18px;
    }

    .staff-member {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 96px;
      color: var(--tamadev-text);
      text-align: center;
      text-decoration: none;
    }

    .staff-avatar {
      display: block;
      width: 68px;
      height: 68px;
      margin-bottom: 8px;
      object-fit: cover;
      border: 1px solid var(--tamadev-border);
      border-radius: 50%;
    }

    .staff-name {
      font-size: .84rem;
      line-height: 1.4;
    }

    .staff-member:hover .staff-name {
      text-decoration: underline;
    }

    /* Footer */
    .footer {
      padding: 10px 0 48px;
      color: var(--tamadev-subtext);
      font-size: .95rem;
    }

    .footer-links {
      margin: 0;
    }

    .footer-links a {
      color: var(--tamadev-blue);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* Lunch map */
    #lunch-map .lunch-layout {
      display: grid;
      grid-template-columns: minmax(0,1.35fr) minmax(0,1fr);
      gap: 18px;
      align-items: start;
    }

    #lunch-map #lunch-map-canvas {
      width: 100%;
      height: 540px;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--tamadev-border);
      border-radius: 18px;
      background: #e5eceb;
      z-index: 0;
    }

    #lunch-map .lunch-list {
      min-width: 0;
      height: 540px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px;
      background: #f8fcfc;
      border: 1px solid var(--tamadev-border);
      border-radius: 18px;
    }

    #lunch-map .lunch-list h3 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      color: var(--tamadev-blue);
    }

    #lunch-map .lunch-legend {
      margin: 0 0 14px;
      color: var(--tamadev-subtext);
      font-size: .85rem;
    }

    #lunch-map .lunch-spot {
      padding: 14px 10px;
      margin: 0 -10px;
      border-bottom: 1px solid var(--tamadev-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .2s ease;
    }

    #lunch-map .lunch-spot:hover {
      background-color: #edf7f6;
    }

    #lunch-map .lunch-spot:focus-visible {
      outline: 3px solid var(--tamadev-sky);
      outline-offset: -3px;
    }

    #lunch-map .lunch-spot h4 {
      margin: 0 0 5px;
      color: var(--tamadev-text);
      font-size: 1rem;
      font-weight: 700;
    }

    #lunch-map .lunch-spot p {
      margin: 5px 0;
      color: var(--tamadev-subtext);
      font-size: .9rem;
      line-height: 1.7;
    }

    #lunch-map .lunch-category {
      color: #99522b !important;
      font-size: .8rem !important;
      font-weight: 700;
    }

    #lunch-map .lunch-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    #lunch-map .lunch-actions a {
      display: inline-block;
      padding: 7px 10px;
      border: 1px solid #c6d7e5;
      border-radius: 9px;
      background: #fff;
      color: var(--tamadev-blue);
      font-size: .85rem;
      font-weight: 700;
      line-height: 1.5;
      text-decoration: none;
      cursor: pointer;
    }

    #lunch-map .lunch-actions a:hover {
      background: #edf5fb;
    }

    #lunch-map .lunch-note {
      margin: 16px 0 0;
      color: var(--tamadev-subtext);
      font-size: .88rem;
      line-height: 1.8;
    }

    #lunch-map .lunch-error {
      color: #a52a2a;
      font-weight: 700;
    }

    /* Leaflet popup */
    #lunch-map .leaflet-popup-content {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #lunch-map .leaflet-popup-content > strong:first-child {
      display: block;
      padding-right: 34px;
    }

    #lunch-map .leaflet-popup-content p {
      margin: 8px 0;
    }

    #lunch-map .leaflet-popup-content a {
      overflow-wrap: anywhere;
    }

    #lunch-map .leaflet-popup-close-button {
      width: 44px !important;
      height: 44px !important;
      top: 4px !important;
      right: 4px !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 28px !important;
      font-weight: 400;
      line-height: 1 !important;
      color: #596a78 !important;
      z-index: 10;
    }

    #lunch-map .leaflet-popup-close-button:hover,
    #lunch-map .leaflet-popup-close-button:focus-visible {
      background: #edf5fb;
      color: var(--tamadev-blue) !important;
    }

    /* Tablet */
    @media (max-width: 960px) {
      .event-summary {
        grid-template-columns: 1.2fr .9fr;
      }

      .info-item {
        grid-template-columns: 82px 1fr;
        gap: 10px;
      }
    }

    /* Mobile */
    @media (max-width: 760px) {
      .conference-visual {
        margin-top: 14px;
        border-radius: 20px;
      }

      .event-summary {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px 20px;
      }

      .summary-title {
        font-size: clamp(1.7rem,7vw,2.2rem);
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 22px 18px;
      }

      #overview {
        padding-top: 22px !important;
      }

      .info-item {
        grid-template-columns: 78px 1fr;
        gap: 8px;
      }

      #lunch-map .lunch-layout {
        grid-template-columns: minmax(0,1fr);
      }

      #lunch-map #lunch-map-canvas {
        height: 400px;
      }

      #lunch-map .lunch-list {
        height: 400px;
        padding: 14px;
      }

      /* スマホの吹き出しをコンパクトに表示 */
      #lunch-map .leaflet-popup-content {
        font-size: 12px;
        line-height: 1.5;
      }

      #lunch-map .leaflet-popup-content p {
        margin: 6px 0;
      }

      #lunch-map .leaflet-popup-content-wrapper {
        border-radius: 12px;
      }
    }

    @media (max-width: 600px) {
      .conference-expansion {
        font-size: .86rem;
      }

      .hero-tagline {
        border-radius: 14px;
      }

      .keynote-profile {
        grid-template-columns: 1fr;
      }

      .keynote-image {
        width: 120px;
        height: 120px;
      }

      .staff-list {
        gap: 20px 12px;
      }

      .staff-member {
        width: 78px;
      }

      .staff-avatar {
        width: 60px;
        height: 60px;
      }

      .staff-name {
        font-size: .78rem;
      }

      .info-note {
        margin-left: 4px;
        font-size: .76rem;
      }

      .news-list {
        max-height: 270px;
      }

      .news-item {
        grid-template-columns: 1fr;
        gap: 4px;
        min-height: 90px;
      }
    }
  </style>
</head>

<div class="page">

  <div class="topbar">
    <a href="/events/">← イベント一覧へ戻る</a>
  </div>

  <!-- Key Visual -->
  <header>
    <h1 class="visually-hidden">
      TechTAMA 2026 Conference | 多摩.dev #6
    </h1>

    <div class="conference-visual">
      <img
        src="./techtama-2026-banner.png"
        alt="TechTAMA 2026 Conference。2026年12月13日開催。多摩.dev #6。"
        width="1672"
        height="941"
        loading="eager"
        fetchpriority="high">
    </div>
  </header>

  <!-- Event Summary -->
  <section class="event-summary">
    <div class="summary-main">
      <h2 class="summary-title">
        <span class="tech-tama-word">
          Tech<span class="tama-accent">TAMA</span>
        </span>
        2026 Conference
      </h2>

      <p class="conference-expansion">
        <span class="tama-initial">T</span>ama,
        <span class="tama-initial">A</span>ssemble for
        <span class="tama-initial">M</span>utual Learning and
        <span class="tama-initial">A</span>ugmentation

<!-- Lunch Map -->
<script>
(() => {
  "use strict";

  const list = document.getElementById("lunch-spots");
  const count = document.getElementById("lunch-count");

  if (typeof L === "undefined") {
    list.textContent =
      "地図ライブラリを読み込めませんでした。";
    return;
  }

  const map = L.map("lunch-map-canvas", {
    scrollWheelZoom: false
  }).setView([35.6501, 139.4487], 15);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">' +
        'OpenStreetMap</a> contributors'
    }
  ).addTo(map);

  const bounds = [];
  const markerEntries = [];

  /*
   * 元の緯度経度を保持し、
   * 表示するピンの位置のみ調整する。
   */
  function registerMarker(marker, lat, lng, kind) {
    markerEntries.push({
      marker,
      origin: L.latLng(lat, lng),
      kind
    });
  }

  /*
   * 会場を優先し、近接する飲食店のピンを
   * 画面上で少しずらして重なりを防ぐ。
   */
  function positionPins() {
    const occupied = [];
    const gap = 43;
    const offsets = [[0, 0]];

    for (let ring = 1; ring <= 7; ring++) {
      const d = gap * ring;

      offsets.push(
        [d, 0],
        [-d, 0],
        [0, -d],
        [0, d],
        [d, -d],
        [-d, -d],
        [d, d],
        [-d, d]
      );
    }

    for (const entry of markerEntries) {
      const base = map.latLngToLayerPoint(entry.origin);
      let selected = base;

      if (entry.kind === "food") {
        for (const [dx, dy] of offsets) {
          const candidate = L.point(
            base.x + dx,
            base.y + dy
          );

          const noOverlap = occupied.every(point =>
            point.distanceTo(candidate) >= gap
          );

          if (noOverlap) {
            selected = candidate;
            break;
          }
        }
      }

      entry.marker.setLatLng(
        map.layerPointToLatLng(selected)
      );

      occupied.push(selected);
    }
  }

  map.on("zoomend resize", positionPins);

  function makeIcon(symbol, color) {
    return L.divIcon({
      className: "",
      html:
        '<div style="' +
        'width:36px;height:36px;' +
        'display:flex;align-items:center;' +
        'justify-content:center;' +
        'border-radius:50%;' +
        'border:2px solid #fff;' +
        'background:' + color + ';' +
        'color:#fff;' +
        'box-shadow:0 2px 8px #0003;' +
        'font-size:18px;">' +
        symbol +
        '</div>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
  }

  const venueIcon = makeIcon("★", "#283f7b");
  const foodIcon = makeIcon("🍴", "#e47b47");

  function mapsUrl(address) {
    return "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(address);
  }

  function xSearchUrl(name) {
    return "https://x.com/search?q=" +
      encodeURIComponent(
        '"' + name + '" #techtama26lunch'
      ) +
      "&f=live";
  }

  function isValidPostUrl(url) {
    return typeof url === "string" &&
      /^https:\/\/(x\.com|twitter\.com)\/[^/]+\/status\/\d+(?:[/?#].*)?$/i
        .test(url);
  }

  function textElement(tag, value) {
    const element = document.createElement(tag);
    element.textContent = value || "";
    return element;
  }

  function makeLink(label, url) {
    const a = document.createElement("a");
    a.textContent = label;
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }

  /*
   * 吹き出しのサイズを地図の表示領域に合わせる。
   * 長い文章は吹き出し内でスクロールする。
   */
  function popupOptions() {
    const size = map.getSize();

    return {
      autoPan: true,
      closeButton: true,
      maxWidth: Math.max(
        130,
        Math.min(260, size.x - 76)
      ),
      maxHeight: Math.max(
        120,
        Math.min(190, size.y - 150)
      ),
      autoPanPaddingTopLeft: L.point(14, 18),
      autoPanPaddingBottomRight: L.point(14, 18)
    };
  }

  /*
   * 画面サイズの変化に合わせて、
   * 開いている吹き出しの制限値を更新する。
   */
  map.on("resize", () => {
    const opened = map._popup;
    if (!opened || !map.hasLayer(opened)) return;

    opened.options.maxWidth = popupOptions().maxWidth;
    opened.options.maxHeight = popupOptions().maxHeight;
    opened.update();
  });

  function addVenue(venue) {
    if (!Number.isFinite(venue.lat) ||
        !Number.isFinite(venue.lng)) {
      return;
    }

    const position = [venue.lat, venue.lng];

    const marker = L.marker(position, {
      icon: venueIcon,
      zIndexOffset: 100
    }).addTo(map);

    const popup = document.createElement("div");

    popup.append(
      textElement("strong", venue.name),
      textElement("p", venue.address),
      makeLink("道順を見る", mapsUrl(venue.address))
    );

    marker.bindPopup(popup, popupOptions());

    registerMarker(
      marker,
      venue.lat,
      venue.lng,
      "venue"
    );

    bounds.push(position);
  }

  function addSpot(spot) {
    if (!Number.isFinite(spot.lat) ||
        !Number.isFinite(spot.lng)) {
      return;
    }

    const position = [spot.lat, spot.lng];

    const marker = L.marker(position, {
      icon: foodIcon
    }).addTo(map);

    bounds.push(position);

    registerMarker(
      marker,
      spot.lat,
      spot.lng,
      "food"
    );

    const searchName = spot.searchName ||
      spot.name
        .replace(/\s*VITA MALL SEISEKI店$/u, "")
        .replace(/\s*聖蹟桜ヶ丘店$/u, "");

    const hasPostUrl = isValidPostUrl(spot.postUrl);

    const postUrl = hasPostUrl
      ? spot.postUrl
      : xSearchUrl(searchName);

    const postLabel = hasPostUrl
      ? "紹介投稿を見る"
      : "Xで紹介投稿を探す";

    const popup = document.createElement("div");

    popup.append(
      textElement("strong", spot.name),
      textElement("p", spot.description),
      makeLink("道順", mapsUrl(spot.address)),
      document.createTextNode(" ／ "),
      makeLink(postLabel, postUrl)
    );

    marker.bindPopup(popup, popupOptions());

    const article = document.createElement("article");
    article.className = "lunch-spot";

    article.append(
      textElement("h4", spot.name)
    );

    const category = textElement("p", spot.category);
    category.className = "lunch-category";
    article.append(category);

    article.append(
      textElement("p", spot.description),
      textElement("p", spot.address)
    );

    function focusSpot() {
      map.setView(
        [spot.lat, spot.lng],
        17,
        { animate: false }
      );

      positionPins();
      marker.openPopup();

      document.getElementById("lunch-map-canvas")
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
    }

    article.tabIndex = 0;
    article.setAttribute("role", "button");
    article.setAttribute(
      "aria-label",
      spot.name + "を地図で見る"
    );

    article.addEventListener("click", event => {
      if (event.target.closest("a")) return;
      focusSpot();
    });

    article.addEventListener("keydown", event => {
      if (event.target !== article) return;

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        focusSpot();
      }
    });

    const actions = document.createElement("div");
    actions.className = "lunch-actions";

    actions.append(
      makeLink("道順", mapsUrl(spot.address)),
      makeLink(postLabel, postUrl)
    );

    article.append(actions);
    list.append(article);
  }

  fetch("./lunch/spots.json", {
    cache: "no-cache"
  })
    .then(response => {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return response.json();
    })
    .then(data => {
      list.textContent = "";

      const venues = data.venues || [];
      const spots = data.spots || [];

      venues.forEach(addVenue);
      spots.forEach(addSpot);

      count.textContent =
        "(" + spots.length + "店)";

      if (bounds.length) {
        map.fitBounds(bounds, {
          padding: [30, 30],
          maxZoom: 16
        });
      }

      positionPins();

      if (spots.length === 0) {
        list.textContent =
          "掲載店舗は準備中です。";
      }

      setTimeout(() => {
        map.invalidateSize();
        positionPins();
      }, 100);
    })
    .catch(error => {
      console.error(
        "ランチマップの読み込みエラー",
        error
      );

      list.replaceChildren(
        textElement(
          "p",
          "店舗情報を読み込めませんでした。"
        )
      );

      list.firstElementChild.className = "lunch-error";
    });
})();
</script>

</body>
</html>

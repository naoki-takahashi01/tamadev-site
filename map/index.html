<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>開催マップ | 多摩.dev</title>

  <meta
    name="description"
    content="多摩.devの開催会場と、今後の開催を検討している候補会場を紹介します。"
  />

  <!-- 多摩.dev共通スタイル -->
  <link rel="stylesheet" href="/style.css" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    .map-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .map-description {
      line-height: 1.8;
    }

    .map-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 16px;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .map-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .map-legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .map-legend-dot--held {
      background-color: #16a34a;
    }

    .map-legend-dot--scheduled {
      background-color: #2563eb;
    }

    .map-legend-dot--candidate {
      background-color: #f59e0b;
    }

    .map-legend-dot--current {
      background-color: #7c3aed;
    }

    .map-location-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #ffffff;
      color: #111827;
      cursor: pointer;
      font-size: 14px;
    }

    .map-location-button:hover {
      background-color: #f9fafb;
    }

    .map-location-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #event-map {
      width: 100%;
      height: 560px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .map-status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
    }

    .map-status--error {
      color: #b91c1c;
    }

    .map-note {
      margin-top: 16px;
      color: #666666;
      font-size: 14px;
      line-height: 1.8;
    }

    .map-popup {
      min-width: 200px;
      max-width: 280px;
    }

    .map-popup h2 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.5;
    }

    .map-popup p {
      margin: 6px 0;
      line-height: 1.6;
    }

    .map-popup-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .venue-section {
      margin-top: 40px;
    }

    .venue-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .venue-card {
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .venue-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.5;
    }

    .venue-card p {
      margin: 8px 0;
      line-height: 1.7;
    }

    .venue-area {
      color: #4b5563;
      font-size: 14px;
    }

    .venue-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .venue-status--held {
      background-color: #dcfce7;
      color: #166534;
    }

    .venue-status--scheduled {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .venue-status--candidate {
      background-color: #fef3c7;
      color: #92400e;
    }

    .venue-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .venue-links a {
      width: fit-content;
    }

    .venue-map-button {
      width: fit-content;
      padding: 0;
      border: 0;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
    }

    .venue-map-button:hover {
      color: #1d4ed8;
    }

    @media (max-width: 640px) {
      .map-controls {
        align-items: flex-start;
        flex-direction: column;
      }

      #event-map {
        height: 440px;
      }

      .venue-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="map-page">
    <h1>多摩.dev 開催マップ</h1>

    <p class="map-description">
      多摩.devは、多摩地域のさまざまな場所を巡りながら、
      地域で学びを交換できる場をつくっています。
    </p>

    <p class="map-description">
      これまでの開催会場や開催予定の会場に加えて、
      今後の開催を検討している会場も紹介しています。
    </p>

    <div class="map-controls">
      <div class="map-legend" aria-label="地図の凡例">
        <span class="map-legend-item">
          <span
            class="map-legend-dot map-legend-dot--held"
            aria-hidden="true"
          ></span>
          開催済み
        </span>

        <span class="map-legend-item">
          <span
            class="map-legend-dot map-legend-dot--scheduled"
            aria-hidden="true"
          ></span>
          開催予定
        </span>

        <span class="map-legend-item">
          <span
            class="map-legend-dot map-legend-dot--candidate"
            aria-hidden="true"
          ></span>
          開催候補
        </span>

        <span class="map-legend-item">
          <span
            class="map-legend-dot map-legend-dot--current"
            aria-hidden="true"
          ></span>
          現在地
        </span>
      </div>

      <button
        id="show-current-location"
        class="map-location-button"
        type="button"
      >
        現在地を表示
      </button>
    </div>

    <div
      id="event-map"
      role="region"
      aria-label="多摩.devの開催会場と候補会場を示した地図"
    ></div>

    <p
      id="map-status"
      class="map-status"
      role="status"
      aria-live="polite"
    ></p>

    <p class="map-note">
      開催候補として掲載している会場は、
      今後の開催を検討している施設です。
      イベントの開催や施設の予約が確定しているものではありません。
    </p>

    <section class="venue-section">
      <h2>開催会場・候補会場</h2>

      <div id="venue-list" class="venue-list"></div>
    </section>

    <p>
      <a href="/">トップページへ戻る</a>
    </p>
  </main>

  <!-- Leaflet本体 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // positionには会場の緯度・経度を指定します。
    // 以下には概算の座標を含むため、
    // 公開前に実際の施設の位置をご確認ください。
    const venues = [
      {
        name: "多摩市立関戸公民館",
        area: "聖蹟桜ヶ丘・多摩市",
        position: [35.6502, 139.4475],
        status: "held",
        description: "多摩.dev #1、#2 などを開催。",
        eventUrl: "/events/"
      },
      {
        name: "せいせきカワマチ",
        area: "聖蹟桜ヶ丘・多摩市",
        position: [35.6544, 139.4505],
        status: "candidate",
        description: "屋外でのLT会など、今後の開催候補。"
      },
      {
        name: "パルテノン多摩",
        area: "多摩センター・多摩市",
        position: [35.6248, 139.4241],
        status: "held",
        description: "多摩.dev #3 を開催。",
        eventUrl: "/events/"
      },
      {
        name: "八王子市生涯学習センター クリエイトホール",
        area: "八王子・八王子市",
        position: [35.6574, 139.3402],
        status: "held",
        description: "多摩.dev #4 を開催。",
        eventUrl: "/events/20260807/"
      },
      {
        name: "たましんRISURUホール",
        area: "立川・立川市",
        position: [35.6950, 139.4213],
        status: "scheduled",
        description: "2026年10月16日：多摩.dev #5",
        eventUrl: "https://tamadev.connpass.com/event/401154/"
      },
      {
        name: "調布市文化会館たづくり",
        area: "調布・調布市",
        position: [35.6501, 139.5431],
        status: "candidate",
        description: "今後の開催候補。"
      },
      {
        name: "八王子市生涯学習センター 南大沢分館",
        area: "南大沢・八王子市",
        position: [35.6143, 139.3800],
        status: "candidate",
        description: "今後の開催候補。"
      },
      {
        name: "稲城市立地域振興プラザ",
        area: "稲城・稲城市",
        position: [35.6360, 139.5024],
        status: "candidate",
        description: "今後の開催候補。"
      }
    ];

    const statusLabels = {
      held: "開催済み",
      scheduled: "開催予定",
      candidate: "開催候補"
    };

    const statusColors = {
      held: "#16a34a",
      scheduled: "#2563eb",
      candidate: "#f59e0b"
    };

    const venueList = document.getElementById("venue-list");

    const locationButton = document.getElementById(
      "show-current-location"
    );

    const statusElement = document.getElementById("map-status");

    const map = L.map("event-map", {
      scrollWheelZoom: false
    }).setView([35.6500, 139.4300], 11);

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    function createDirectionsUrl(venueName) {
      const directionsUrl = new URL(
        "https://www.google.com/maps/dir/"
      );

      directionsUrl.searchParams.set("api", "1");
      directionsUrl.searchParams.set("destination", venueName);
      directionsUrl.searchParams.set("travelmode", "transit");

      return directionsUrl.toString();
    }

    function createExternalLink(url, label) {
      const link = document.createElement("a");

      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = label;

      return link;
    }

    function createEventLink(venue) {
      if (!venue.eventUrl) {
        return null;
      }

      const link = document.createElement("a");
      link.href = venue.eventUrl;

      if (/^https?:\/\//.test(venue.eventUrl)) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }

      link.textContent = venue.eventUrl.includes("connpass.com")
        ? "connpassでイベント情報を見る"
        : "イベント情報を見る";

      return link;
    }

    function createStatusBadge(venue) {
      const badge = document.createElement("span");

      badge.className = `venue-status venue-status--${venue.status}`;
      badge.textContent = statusLabels[venue.status];

      return badge;
    }

    function createPopup(venue) {
      const popup = document.createElement("div");
      popup.className = "map-popup";

      const title = document.createElement("h2");
      title.textContent = venue.name;
      popup.appendChild(title);

      const area = document.createElement("p");
      area.textContent = venue.area;
      popup.appendChild(area);

      const statusParagraph = document.createElement("p");
      statusParagraph.appendChild(createStatusBadge(venue));
      popup.appendChild(statusParagraph);

      const description = document.createElement("p");
      description.textContent = venue.description;
      popup.appendChild(description);

      const links = document.createElement("div");
      links.className = "map-popup-links";

      const eventLink = createEventLink(venue);

      if (eventLink) {
        links.appendChild(eventLink);
      }

      links.appendChild(
        createExternalLink(
          createDirectionsUrl(venue.name),
          "Googleマップでアクセス方法を見る"
        )
      );

      popup.appendChild(links);

      return popup;
    }

    function createVenueCard(venue, marker) {
      const card = document.createElement("article");
      card.className = "venue-card";

      const title = document.createElement("h3");
      title.textContent = venue.name;
      card.appendChild(title);

      const statusParagraph = document.createElement("p");
      statusParagraph.appendChild(createStatusBadge(venue));
      card.appendChild(statusParagraph);

      const area = document.createElement("p");
      area.className = "venue-area";
      area.textContent = venue.area;
      card.appendChild(area);

      const description = document.createElement("p");
      description.textContent = venue.description;
      card.appendChild(description);

      const links = document.createElement("div");
      links.className = "venue-links";

      const mapButton = document.createElement("button");
      mapButton.type = "button";
      mapButton.className = "venue-map-button";
      mapButton.textContent = "地図で場所を見る";

      mapButton.addEventListener("click", () => {
        document.getElementById("event-map").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        map.setView(venue.position, 15);
        marker.openPopup();
      });

      links.appendChild(mapButton);

      const eventLink = createEventLink(venue);

      if (eventLink) {
        links.appendChild(eventLink);
      }

      links.appendChild(
        createExternalLink(
          createDirectionsUrl(venue.name),
          "Googleマップでアクセス方法を見る"
        )
      );

      card.appendChild(links);

      return card;
    }

    for (const venue of venues) {
      const marker = L.circleMarker(venue.position, {
        radius: 10,
        fillColor: statusColors[venue.status],
        color: "#ffffff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map);

      marker.bindPopup(createPopup(venue));

      venueList.appendChild(
        createVenueCard(venue, marker)
      );
    }

    if (venues.length > 0) {
      map.fitBounds(
        venues.map((venue) => venue.position),
        {
          padding: [40, 40]
        }
      );
    }

    let currentLocationMarker = null;
    let currentLocationCircle = null;

    function showStatus(message, isError = false) {
      statusElement.textContent = message;

      statusElement.classList.toggle(
        "map-status--error",
        isError
      );
    }

    function setLocationLoading(isLoading) {
      locationButton.disabled = isLoading;

      locationButton.textContent = isLoading
        ? "現在地を取得中..."
        : "現在地を表示";
    }

    locationButton.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showStatus(
          "お使いのブラウザでは位置情報を利用できません。",
          true
        );
        return;
      }

      setLocationLoading(true);

      showStatus(
        "現在地を取得しています。位置情報の利用を許可してください。"
      );

      map.locate({
        setView: true,
        maxZoom: 13,
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 60000
      });
    });

    map.on("locationfound", (event) => {
      setLocationLoading(false);

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }

      if (currentLocationCircle) {
        map.removeLayer(currentLocationCircle);
      }

      currentLocationCircle = L.circle(event.latlng, {
        radius: event.accuracy,
        color: "#7c3aed",
        fillColor: "#7c3aed",
        fillOpacity: 0.08,
        weight: 1
      }).addTo(map);

      currentLocationMarker = L.circleMarker(event.latlng, {
        radius: 9,
        fillColor: "#7c3aed",
        color: "#ffffff",
        weight: 3,
        opacity: 1,
        fillOpacity: 1
      })
        .addTo(map)
        .bindPopup("現在地")
        .openPopup();

      showStatus("現在地を表示しました。");
    });

    map.on("locationerror", (event) => {
      setLocationLoading(false);

      if (event.code === 1) {
        showStatus(
          "位置情報の利用が許可されていません。ブラウザの設定をご確認ください。",
          true
        );
        return;
      }

      if (event.code === 3) {
        showStatus(
          "現在地の取得に時間がかかりました。もう一度お試しください。",
          true
        );
        return;
      }

      showStatus(
        "現在地を取得できませんでした。端末の位置情報設定をご確認ください。",
        true
      );
    });
  </script>
</body>
</html>

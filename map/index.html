<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>開催地・おすすめスポットマップ | 多摩.dev</title>

  <meta
    name="description"
    content="多摩.devの開催会場、候補会場、コミュニティで紹介された多摩地域のおすすめスポットを紹介します。"
  />

  <link
    rel="stylesheet"
    href="/style.css"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    .map-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .map-description {
      line-height: 1.8;
    }

    .map-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 16px;
    }

    .map-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .map-filter {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      color: #111827;
      cursor: pointer;
      font-size: 14px;
    }

    .map-filter input {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
    }

    .map-filter-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .map-filter-dot--held {
      background-color: #16a34a;
    }

    .map-filter-dot--scheduled {
      background-color: #2563eb;
    }

    .map-filter-dot--candidate {
      background-color: #f59e0b;
    }

    .map-filter-dot--spot {
      background-color: #db2777;
    }

    .map-location-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #ffffff;
      color: #111827;
      cursor: pointer;
      font-size: 14px;
    }

    .map-location-button:hover {
      background-color: #f9fafb;
    }

    .map-location-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #event-map {
      width: 100%;
      height: 560px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .map-status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
    }

    .map-status--error {
      color: #b91c1c;
    }

    .map-note {
      margin-top: 16px;
      color: #666666;
      font-size: 14px;
      line-height: 1.8;
    }

    .map-popup {
      min-width: 200px;
      max-width: 280px;
    }

    .map-popup h2 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.5;
    }

    .map-popup p {
      margin: 6px 0;
      line-height: 1.6;
    }

    .map-popup-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .venue-section {
      margin-top: 40px;
    }

    .venue-list {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );
      gap: 16px;
      margin-top: 20px;
    }

    .venue-card {
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .venue-card[hidden],
    .venue-section[hidden] {
      display: none;
    }

    .venue-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.5;
    }

    .venue-card p {
      margin: 8px 0;
      line-height: 1.7;
    }

    .venue-area {
      color: #4b5563;
      font-size: 14px;
    }

    .venue-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .venue-status--held {
      background-color: #dcfce7;
      color: #166534;
    }

    .venue-status--scheduled {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .venue-status--candidate {
      background-color: #fef3c7;
      color: #92400e;
    }

    .venue-status--spot {
      background-color: #fce7f3;
      color: #9d174d;
    }

    .venue-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .venue-links a {
      width: fit-content;
    }

    .venue-map-button {
      width: fit-content;
      padding: 0;
      border: 0;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
    }

    .venue-map-button:hover {
      color: #1d4ed8;
    }

    .community-status {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 640px) {
      .map-controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .map-filters {
        gap: 8px 14px;
      }

      #event-map {
        height: 440px;
      }

      .venue-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="map-page">
    <h1>
      多摩.dev 開催地・おすすめスポットマップ
    </h1>

    <p class="map-description">
      多摩.devは、多摩地域のさまざまな場所を巡りながら、
      地域で学びを交換できる場をつくっています。
    </p>

    <p class="map-description">
      これまでの開催会場や開催予定の会場に加えて、
      今後の開催を検討している会場や、コミュニティで紹介された
      多摩地域のおすすめスポットも紹介しています。
    </p>

    <div class="map-controls">
      <fieldset
        class="map-filters"
        aria-label="地図に表示する場所を選択"
      >
        <label class="map-filter">
          <input
            type="checkbox"
            value="held"
            checked
          />

          <span
            class="map-filter-dot map-filter-dot--held"
            aria-hidden="true"
          ></span>

          開催済み
        </label>

        <label class="map-filter">
          <input
            type="checkbox"
            value="scheduled"
            checked
          />

          <span
            class="map-filter-dot map-filter-dot--scheduled"
            aria-hidden="true"
          ></span>

          開催予定
        </label>

        <label class="map-filter">
          <input
            type="checkbox"
            value="candidate"
            checked
          />

          <span
            class="map-filter-dot map-filter-dot--candidate"
            aria-hidden="true"
          ></span>

          開催候補
        </label>

        <label class="map-filter">
          <input
            type="checkbox"
            value="spot"
            checked
          />

          <span
            class="map-filter-dot map-filter-dot--spot"
            aria-hidden="true"
          ></span>

          おすすめスポット
        </label>
      </fieldset>

      <button
        id="show-current-location"
        class="map-location-button"
        type="button"
      >
        現在地を表示
      </button>
    </div>

    <div
      id="event-map"
      role="region"
      aria-label="多摩.devの開催会場、候補会場、おすすめスポットを示した地図"
    ></div>

    <p
      id="map-status"
      class="map-status"
      role="status"
      aria-live="polite"
    ></p>

    <p class="map-note">
      開催候補として掲載している会場は、
      今後の開催を検討している施設です。
      イベントの開催や施設の予約が確定しているものではありません。
    </p>

    <section
      id="venue-section"
      class="venue-section"
    >
      <h2>
        開催会場・候補会場
      </h2>

      <div
        id="venue-list"
        class="venue-list"
      ></div>
    </section>

    <section
      id="community-section"
      class="venue-section"
    >
      <h2>
        コミュニティのおすすめスポット
      </h2>

      <p
        id="community-status"
        class="community-status"
        role="status"
      >
        おすすめスポットを読み込んでいます。
      </p>

      <div
        id="community-spot-list"
        class="venue-list"
      ></div>
    </section>

    <p>
      <a href="/">
        トップページへ戻る
      </a>
    </p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const venues = [
      {
        name:
          "多摩市立関戸公民館",

        area:
          "聖蹟桜ヶ丘・多摩市",

        position: [
          35.6502,
          139.4475
        ],

        status:
          "held",

        description:
          "多摩.dev #1、#2 などを開催。",

        eventUrl:
          "/events/"
      },

      {
        name:
          "せいせきカワマチ",

        area:
          "聖蹟桜ヶ丘・多摩市",

        position: [
          35.6544,
          139.4505
        ],

        status:
          "candidate",

        description:
          "屋外でのLT会など、今後の開催候補。"
      },

      {
        name:
          "パルテノン多摩",

        area:
          "多摩センター・多摩市",

        position: [
          35.6248,
          139.4241
        ],

        status:
          "held",

        description:
          "多摩.dev #3 を開催。",

        eventUrl:
          "/events/"
      },

      {
        name:
          "八王子市生涯学習センター クリエイトホール",

        area:
          "八王子・八王子市",

        position: [
          35.6574,
          139.3402
        ],

        status:
          "held",

        description:
          "多摩.dev #4 を開催。",

        eventUrl:
          "/events/20260807/"
      },

      {
        name:
          "たましんRISURUホール",

        area:
          "立川・立川市",

        position: [
          35.6950,
          139.4213
        ],

        status:
          "scheduled",

        description:
          "2026年10月16日：多摩.dev #5",

        eventUrl:
          "https://tamadev.connpass.com/event/401154/"
      },

      {
        name:
          "調布市文化会館たづくり",

        area:
          "調布・調布市",

        position: [
          35.6501,
          139.5431
        ],

        status:
          "candidate",

        description:
          "今後の開催候補。"
      },

      {
        name:
          "八王子市生涯学習センター 南大沢分館",

        area:
          "南大沢・八王子市",

        position: [
          35.6143,
          139.3800
        ],

        status:
          "candidate",

        description:
          "今後の開催候補。"
      },

      {
        name:
          "稲城市立地域振興プラザ",

        area:
          "稲城・稲城市",

        position: [
          35.6360,
          139.5024
        ],

        status:
          "candidate",

        description:
          "今後の開催候補。"
      }
    ];

    const statusLabels = {
      held:
        "開催済み",

      scheduled:
        "開催予定",

      candidate:
        "開催候補",

      spot:
        "おすすめスポット"
    };

    const statusColors = {
      held:
        "#16a34a",

      scheduled:
        "#2563eb",

      candidate:
        "#f59e0b",

      spot:
        "#db2777"
    };

    const venueList =
      document.getElementById(
        "venue-list"
      );

    const communitySpotList =
      document.getElementById(
        "community-spot-list"
      );

    const communityStatus =
      document.getElementById(
        "community-status"
      );

    const venueSection =
      document.getElementById(
        "venue-section"
      );

    const communitySection =
      document.getElementById(
        "community-section"
      );

    const locationButton =
      document.getElementById(
        "show-current-location"
      );

    const statusElement =
      document.getElementById(
        "map-status"
      );

    const filterInputs =
      document.querySelectorAll(
        ".map-filters input[type='checkbox']"
      );

    const communitySpotsUrl =
      "https://raw.githubusercontent.com/naoki-takahashi01/tamadev-site/main/map/spots.json";

    const places = [];

    const map = L.map(
      "event-map",
      {
        scrollWheelZoom:
          false
      }
    ).setView(
      [
        35.6500,
        139.4300
      ],
      11
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom:
          19,

        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    ).addTo(
      map
    );

    function createDirectionsUrl(
      venueName
    ) {
      const url = new URL(
        "https://www.google.com/maps/dir/"
      );

      url.searchParams.set(
        "api",
        "1"
      );

      url.searchParams.set(
        "destination",
        venueName
      );

      url.searchParams.set(
        "travelmode",
        "transit"
      );

      return url.toString();
    }

    function createExternalLink(
      url,
      label
    ) {
      const link =
        document.createElement(
          "a"
        );

      link.href =
        url;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        label;

      return link;
    }

    function createEventLink(
      venue
    ) {
      if (
        !venue.eventUrl
      ) {
        return null;
      }

      const link =
        document.createElement(
          "a"
        );

      link.href =
        venue.eventUrl;

      if (
        /^https?:\/\//i.test(
          venue.eventUrl
        )
      ) {
        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";
      }

      if (
        venue.status === "spot"
      ) {
        link.textContent =
          "紹介記事・公式サイトを見る";

      } else if (
        venue.eventUrl.includes(
          "connpass.com"
        )
      ) {
        link.textContent =
          "connpassでイベント情報を見る";

      } else {
        link.textContent =
          "イベント情報を見る";
      }

      return link;
    }

    function createStatusBadge(
      venue
    ) {
      const badge =
        document.createElement(
          "span"
        );

      badge.className =
        `venue-status venue-status--${venue.status}`;

      badge.textContent =
        statusLabels[
          venue.status
        ];

      return badge;
    }

    function createPopup(
      venue
    ) {
      const popup =
        document.createElement(
          "div"
        );

      popup.className =
        "map-popup";

      const title =
        document.createElement(
          "h2"
        );

      title.textContent =
        venue.name;

      popup.appendChild(
        title
      );

      const area =
        document.createElement(
          "p"
        );

      area.textContent =
        venue.area;

      popup.appendChild(
        area
      );

      const statusParagraph =
        document.createElement(
          "p"
        );

      statusParagraph.appendChild(
        createStatusBadge(
          venue
        )
      );

      popup.appendChild(
        statusParagraph
      );

      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        venue.description;

      popup.appendChild(
        description
      );

      const links =
        document.createElement(
          "div"
        );

      links.className =
        "map-popup-links";

      const eventLink =
        createEventLink(
          venue
        );

      if (
        eventLink
      ) {
        links.appendChild(
          eventLink
        );
      }

      links.appendChild(
        createExternalLink(
          createDirectionsUrl(
            venue.name
          ),
          "Googleマップでアクセス方法を見る"
        )
      );

      popup.appendChild(
        links
      );

      return popup;
    }

    function createVenueCard(
      venue,
      marker
    ) {
      const card =
        document.createElement(
          "article"
        );

      card.className =
        "venue-card";

      card.dataset.status =
        venue.status;

      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        venue.name;

      card.appendChild(
        title
      );

      const statusParagraph =
        document.createElement(
          "p"
        );

      statusParagraph.appendChild(
        createStatusBadge(
          venue
        )
      );

      card.appendChild(
        statusParagraph
      );

      const area =
        document.createElement(
          "p"
        );

      area.className =
        "venue-area";

      area.textContent =
        venue.area;

      card.appendChild(
        area
      );

      const description =
        document.createElement(
          "p"
        );

      description.textContent =
        venue.description;

      card.appendChild(
        description
      );

      const links =
        document.createElement(
          "div"
        );

      links.className =
        "venue-links";

      const mapButton =
        document.createElement(
          "button"
        );

      mapButton.type =
        "button";

      mapButton.className =
        "venue-map-button";

      mapButton.textContent =
        "地図で場所を見る";

      mapButton.addEventListener(
        "click",
        () => {
          document.getElementById(
            "event-map"
          ).scrollIntoView({
            behavior:
              "smooth",

            block:
              "center"
          });

          map.setView(
            venue.position,
            15
          );

          marker.openPopup();
        }
      );

      links.appendChild(
        mapButton
      );

      const eventLink =
        createEventLink(
          venue
        );

      if (
        eventLink
      ) {
        links.appendChild(
          eventLink
        );
      }

      links.appendChild(
        createExternalLink(
          createDirectionsUrl(
            venue.name
          ),
          "Googleマップでアクセス方法を見る"
        )
      );

      card.appendChild(
        links
      );

      return card;
    }

    function addPlaceToMap(
      venue,
      listElement
    ) {
      const marker =
        L.circleMarker(
          venue.position,
          {
            radius:
              10,

            fillColor:
              statusColors[
                venue.status
              ],

            color:
              "#ffffff",

            weight:
              2,

            opacity:
              1,

            fillOpacity:
              0.95
          }
        );

      marker.bindPopup(
        createPopup(
          venue
        )
      );

      const card =
        createVenueCard(
          venue,
          marker
        );

      listElement.appendChild(
        card
      );

      places.push({
        venue,
        marker,
        card
      });

      return marker;
    }

    function getVisibleStatuses() {
      return new Set(
        Array.from(
          filterInputs
        )
          .filter(
            (input) =>
              input.checked
          )
          .map(
            (input) =>
              input.value
          )
      );
    }

    function updateVisiblePlaces(
      adjustBounds = true
    ) {
      const visibleStatuses =
        getVisibleStatuses();

      const visiblePositions = [];

      let visibleVenueCount =
        0;

      for (const place of places) {
        const visible =
          visibleStatuses.has(
            place.venue.status
          );

        place.card.hidden =
          !visible;

        if (
          visible
        ) {
          if (
            !map.hasLayer(
              place.marker
            )
          ) {
            place.marker.addTo(
              map
            );
          }

          visiblePositions.push(
            place.venue.position
          );

          if (
            place.venue.status !== "spot"
          ) {
            visibleVenueCount += 1;
          }

        } else if (
          map.hasLayer(
            place.marker
          )
        ) {
          map.removeLayer(
            place.marker
          );
        }
      }

      venueSection.hidden =
        visibleVenueCount === 0;

      communitySection.hidden =
        !visibleStatuses.has(
          "spot"
        );

      if (
        adjustBounds &&
        visiblePositions.length > 0
      ) {
        map.fitBounds(
          visiblePositions,
          {
            padding: [
              35,
              35
            ],

            maxZoom:
              15
          }
        );
      }
    }

    for (const input of filterInputs) {
      input.addEventListener(
        "change",
        () => {
          updateVisiblePlaces();
        }
      );
    }

    for (const venue of venues) {
      addPlaceToMap(
        venue,
        venueList
      );
    }

    updateVisiblePlaces();

    function isValidCommunitySpot(
      spot
    ) {
      return (
        spot &&

        typeof spot.name === "string" &&

        spot.name.trim().length > 0 &&

        Array.isArray(
          spot.position
        ) &&

        spot.position.length === 2 &&

        spot.position.every(
          (coordinate) =>
            Number.isFinite(
              coordinate
            )
        ) &&

        Math.abs(
          spot.position[0]
        ) <= 90 &&

        Math.abs(
          spot.position[1]
        ) <= 180 &&

        (
          !spot.sourceUrl ||

          /^https?:\/\//i.test(
            spot.sourceUrl
          )
        )
      );
    }

    async function loadCommunitySpots() {
      try {
        const latestJsonUrl =
          `${communitySpotsUrl}?v=${Date.now()}`;

        const response = await fetch(
          latestJsonUrl,
          {
            cache:
              "no-store"
          }
        );

        if (
          !response.ok
        ) {
          throw new Error(
            `スポット情報の取得に失敗しました: ${response.status}`
          );
        }

        const spots =
          await response.json();

        if (
          !Array.isArray(
            spots
          )
        ) {
          throw new Error(
            "スポット情報の形式が正しくありません。"
          );
        }

        let spotCount =
          0;

        for (const spot of spots) {
          if (
            !isValidCommunitySpot(
              spot
            )
          ) {
            console.warn(
              "形式が正しくないスポットを除外しました。",
              spot
            );

            continue;
          }

          const venue = {
            name:
              spot.name,

            area:
              spot.area ||
              "多摩地域",

            position:
              spot.position,

            status:
              "spot",

            description:
              spot.description ||
              "コミュニティで紹介されたスポット。",

            eventUrl:
              spot.sourceUrl ||
              undefined
          };

          addPlaceToMap(
            venue,
            communitySpotList
          );

          spotCount += 1;
        }

        if (
          spotCount === 0
        ) {
          communityStatus.textContent =
            "おすすめスポットはまだ登録されていません。";

        } else {
          communityStatus.textContent =
            `Discordで紹介された${spotCount}件のスポットを掲載しています。`;
        }

        updateVisiblePlaces();

      } catch (
        error
      ) {
        console.error(
          "おすすめスポットの読み込みに失敗しました。",
          error
        );

        communityStatus.textContent =
          "おすすめスポットを読み込めませんでした。時間をおいて再度お試しください。";
      }
    }

    loadCommunitySpots();

    let currentLocationMarker =
      null;

    let currentLocationAccuracy =
      null;

    locationButton.addEventListener(
      "click",
      () => {
        if (
          !navigator.geolocation
        ) {
          statusElement.classList.add(
            "map-status--error"
          );

          statusElement.textContent =
            "この端末では現在地を取得できません。";

          return;
        }

        locationButton.disabled =
          true;

        statusElement.classList.remove(
          "map-status--error"
        );

        statusElement.textContent =
          "現在地を確認しています。";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;

            const coordinates = [
              latitude,
              longitude
            ];

            if (
              currentLocationMarker
            ) {
              map.removeLayer(
                currentLocationMarker
              );
            }

            if (
              currentLocationAccuracy
            ) {
              map.removeLayer(
                currentLocationAccuracy
              );
            }

            currentLocationMarker =
              L.circleMarker(
                coordinates,
                {
                  radius:
                    9,

                  fillColor:
                    "#7c3aed",

                  color:
                    "#ffffff",

                  weight:
                    2,

                  fillOpacity:
                    1
                }
              ).addTo(
                map
              );

            currentLocationMarker.bindPopup(
              "現在地"
            );

            currentLocationAccuracy =
              L.circle(
                coordinates,
                {
                  radius:
                    accuracy,

                  color:
                    "#7c3aed",

                  weight:
                    1,

                  fillColor:
                    "#7c3aed",

                  fillOpacity:
                    0.08
                }
              ).addTo(
                map
              );

            map.setView(
              coordinates,
              14
            );

            currentLocationMarker.openPopup();

            locationButton.disabled =
              false;

            statusElement.textContent =
              "現在地を表示しました。";
          },

          (error) => {
            locationButton.disabled =
              false;

            statusElement.classList.add(
              "map-status--error"
            );

            if (
              error.code === 1
            ) {
              statusElement.textContent =
                "位置情報の利用が許可されていません。ブラウザの設定をご確認ください。";

            } else if (
              error.code === 2
            ) {
              statusElement.textContent =
                "現在地を取得できませんでした。";

            } else {
              statusElement.textContent =
                "現在地の取得がタイムアウトしました。";
            }
          },

          {
            enableHighAccuracy:
              true,

            timeout:
              10000,

            maximumAge:
              60000
          }
        );
      }
    );
  </script>
</body>
</html>

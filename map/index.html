<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>開催マップ | 多摩.dev</title>

  <meta
    name="description"
    content="多摩.devの開催会場と、今後の開催を検討している候補会場を紹介します。"
  />

  <!-- 多摩.dev共通スタイル -->
  <link rel="stylesheet" href="/style.css" />

  <style>
    .map-page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .map-description {
      line-height: 1.8;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 24px 0 16px;
    }

    .map-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .map-legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .map-legend-dot--held {
      background-color: #16a34a;
    }

    .map-legend-dot--scheduled {
      background-color: #2563eb;
    }

    .map-legend-dot--candidate {
      background-color: #f59e0b;
    }

    .map-frame {
      display: block;
      width: 100%;
      height: 560px;
      border: 0;
      border-radius: 12px;
    }

    .map-note {
      margin-top: 16px;
      color: #666666;
      font-size: 14px;
      line-height: 1.8;
    }

    .venue-section {
      margin-top: 40px;
    }

    .venue-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .venue-card {
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .venue-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.5;
    }

    .venue-card p {
      margin: 8px 0;
      line-height: 1.7;
    }

    .venue-area {
      color: #4b5563;
      font-size: 14px;
    }

    .venue-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .venue-status--held {
      background-color: #dcfce7;
      color: #166534;
    }

    .venue-status--scheduled {
      background-color: #dbeafe;
      color: #1d4ed8;
    }

    .venue-status--candidate {
      background-color: #fef3c7;
      color: #92400e;
    }

    .venue-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .venue-links a {
      width: fit-content;
    }

    @media (max-width: 640px) {
      .map-frame {
        height: 440px;
      }

      .venue-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="map-page">
    <h1>多摩.dev 開催マップ</h1>

    <p class="map-description">
      多摩.devは、多摩地域のさまざまな場所を巡りながら、
      地域で学びを交換できる場をつくっています。
    </p>

    <p class="map-description">
      これまでの開催会場や開催予定の会場に加えて、
      今後の開催を検討している会場も紹介しています。
    </p>

    <div class="map-legend" aria-label="開催状況の凡例">
      <span class="map-legend-item">
        <span
          class="map-legend-dot map-legend-dot--held"
          aria-hidden="true"
        ></span>
        開催済み
      </span>

      <span class="map-legend-item">
        <span
          class="map-legend-dot map-legend-dot--scheduled"
          aria-hidden="true"
        ></span>
        開催予定
      </span>

      <span class="map-legend-item">
        <span
          class="map-legend-dot map-legend-dot--candidate"
          aria-hidden="true"
        ></span>
        開催候補
      </span>
    </div>

    <!-- YOUR_MAP_IDをGoogleマイマップの地図IDに置き換えてください -->
    <iframe
      class="map-frame"
      src="https://www.google.com/maps/d/embed?mid=YOUR_MAP_ID"
      loading="lazy"
      title="多摩.dev 開催会場マップ"
    ></iframe>

    <p class="map-note">
      開催候補として掲載している会場は、
      今後の開催を検討している施設です。
      イベントの開催や施設の予約が確定しているものではありません。
    </p>

    <section class="venue-section">
      <h2>開催会場・候補会場</h2>

      <div id="venue-list" class="venue-list"></div>
    </section>

    <p>
      <a href="/">トップページへ戻る</a>
    </p>
  </main>

  <script>
    const venues = [
      {
        name: "多摩市立関戸公民館",
        area: "聖蹟桜ヶ丘・多摩市",
        status: "held",
        description: "多摩.dev #1、#2 などを開催。",
        eventUrl: "/events/"
      },
      {
        name: "パルテノン多摩",
        area: "多摩センター・多摩市",
        status: "held",
        description: "多摩.dev #3 を開催。",
        eventUrl: "/events/"
      },
      {
        name: "八王子市生涯学習センター クリエイトホール",
        area: "八王子・八王子市",
        status: "held",
        description: "多摩.dev #4 を開催。",
        eventUrl: "/events/20260807/"
      },
      {
        name: "たましんRISURUホール",
        area: "立川・立川市",
        status: "scheduled",
        description: "2026年10月16日：多摩.dev #5",
        eventUrl: "https://tamadev.connpass.com/event/401154/"
      },
      {
        name: "調布市文化会館たづくり",
        area: "調布・調布市",
        status: "candidate",
        description: "今後の開催候補。"
      },
      {
        name: "八王子市生涯学習センター 南大沢分館",
        area: "南大沢・八王子市",
        status: "candidate",
        description: "今後の開催候補。"
      },
      {
        name: "稲城市立地域振興プラザ",
        area: "稲城・稲城市",
        status: "candidate",
        description: "今後の開催候補。"
      }
    ];

    const statusLabels = {
      held: "開催済み",
      scheduled: "開催予定",
      candidate: "開催候補"
    };

    const venueList = document.getElementById("venue-list");

    for (const venue of venues) {
      const card = document.createElement("article");
      card.className = "venue-card";

      const title = document.createElement("h3");
      title.textContent = venue.name;
      card.appendChild(title);

      const statusParagraph = document.createElement("p");

      const status = document.createElement("span");
      status.className = `venue-status venue-status--${venue.status}`;
      status.textContent = statusLabels[venue.status];

      statusParagraph.appendChild(status);
      card.appendChild(statusParagraph);

      const area = document.createElement("p");
      area.className = "venue-area";
      area.textContent = venue.area;
      card.appendChild(area);

      const description = document.createElement("p");
      description.textContent = venue.description;
      card.appendChild(description);

      const links = document.createElement("div");
      links.className = "venue-links";

      if (venue.eventUrl) {
        const eventLink = document.createElement("a");
        eventLink.href = venue.eventUrl;

        if (venue.eventUrl.startsWith("http")) {
          eventLink.target = "_blank";
          eventLink.rel = "noopener noreferrer";
        }

        eventLink.textContent = venue.eventUrl.includes("connpass.com")
          ? "connpassでイベント情報を見る"
          : "イベント情報を見る";

        links.appendChild(eventLink);
      }

      const directionsUrl = new URL(
        "https://www.google.com/maps/dir/"
      );

      directionsUrl.searchParams.set("api", "1");
      directionsUrl.searchParams.set("destination", venue.name);
      directionsUrl.searchParams.set("travelmode", "transit");

      const directionsLink = document.createElement("a");
      directionsLink.href = directionsUrl.toString();
      directionsLink.target = "_blank";
      directionsLink.rel = "noopener noreferrer";
      directionsLink.textContent =
        "Googleマップでアクセス方法を見る";

      links.appendChild(directionsLink);

      card.appendChild(links);
      venueList.appendChild(card);
    }
  </script>
</body>
</html>
